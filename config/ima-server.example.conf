# ima-server configuration (go-conf syntax). $NAME reads an environment variable.
server {
  listen: ':8080'
  read_header_timeout: '5s'
  shutdown_timeout: '15s'
  # Only these peers may set X-Forwarded-For.
  trusted_proxies: ['10.0.0.0/8']
}

ima {
  access_ttl: '15m'
  refresh_ttl: '720h'
  session_max_age: '2160h'
}

components {
  postgres {
    primary {
      dsn: $IMA_DATABASE_URL
    }
  }
}
